[Ollama]
#
# Ollama Local LLM Configuration
#

# Ollama server configuration
BASE_URL=http://localhost:11434
TIMEOUT=480

# Models - check available models with: curl http://localhost:11434/api/tags
MODEL=llama2:latest
REASONING_MODEL=llama2:latest
EMBEDDING_MODEL=llama2:latest

#
# Model parameters
#

MAX_TOKENS=16000
TEMPERATURE=1.1
FREQ_PENALTY=0.1
PRESENCE_PENALTY=0.1
MAX_ATTEMPTS=5
WAITING_TIME=1
EXPONENTIAL_BACKOFF_FACTOR=5

#
# Caching
#

CACHE_API_CALLS=True
CACHE_FILE_NAME=ollama_api_cache.pickle

#
# Other
#

MAX_CONTENT_DISPLAY_LENGTH=4000

[Simulation]

PARALLEL_AGENT_GENERATION=False
PARALLEL_AGENT_ACTIONS=False

RAI_HARMFUL_CONTENT_PREVENTION=True
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=True

[Cognition]

ENABLE_MEMORY_CONSOLIDATION=True

MIN_EPISODE_LENGTH=15
MAX_EPISODE_LENGTH=50

EPISODIC_MEMORY_FIXED_PREFIX_LENGTH=10
EPISODIC_MEMORY_LOOKBACK_LENGTH=20

[ActionGenerator]
MAX_ATTEMPTS=2

# This will determine whether any of the following verifications and corrections are performed.
ENABLE_QUALITY_CHECKS=False

ENABLE_REGENERATION=True
ENABLE_DIRECT_CORRECTION=False

ENABLE_QUALITY_CHECK_FOR_PERSONA_ADHERENCE=True
ENABLE_QUALITY_CHECK_FOR_SELFCONSISTENCY=False
ENABLE_QUALITY_CHECK_FOR_FLUENCY=False
ENABLE_QUALITY_CHECK_FOR_SUITABILITY=False
ENABLE_QUALITY_CHECK_FOR_SIMILARITY=False

CONTINUE_ON_FAILURE=True

# 0 to 9
QUALITY_THRESHOLD = 5

[Logging]
LOGLEVEL=INFO
# ERROR
# WARNING
# INFO
# DEBUG

[Prison]
#
# Prison Simulation Specific Settings
#

# Prison facility configuration
FACILITY_NAME=Eternal Lockdown Correctional Facility
FACILITY_TYPE=medium_security
CAPACITY=500
CURRENT_POPULATION=350

# Simulation parameters
DAILY_ROUTINE_ENABLED=True
INCIDENT_PROBABILITY=0.1
VISITOR_DAY_FREQUENCY=weekly
REHABILITATION_PROGRAMS=True

# Persona distribution
INMATE_PERCENTAGE=70
GUARD_PERCENTAGE=15
STAFF_PERCENTAGE=10
VISITOR_PERCENTAGE=5

# Security levels
SECURITY_LEVELS=minimum,medium,maximum
DEFAULT_SECURITY_LEVEL=medium

# Programs available
AVAILABLE_PROGRAMS=education,vocational_training,therapy,substance_abuse,anger_management