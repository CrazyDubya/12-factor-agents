name: Code Quality & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.9'
  POETRY_VERSION: '1.4.2'

jobs:
  quality-check:
    name: Code Quality Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-dev.txt

    - name: Create cache key
      id: cache-key
      run: |
        echo "key=${{ runner.os }}-${{ matrix.python-version }}-$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Cache analysis results
      uses: actions/cache@v3
      with:
        path: |
          .mypy_cache
          .pytest_cache
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.python-version }}-

    - name: Lint with flake8
      run: |
        echo "::group::Flake8 Linting"
        python -m flake8 . --config=setup.cfg --format='::error file=%(path)s,line=%(row)d,col=%(col)d,title=Flake8::%(path)s:%(row)d:%(col)d: %(code)s %(text)s'
        echo "::endgroup::"

    - name: Check code formatting with black
      run: |
        echo "::group::Black Code Formatting"
        python -m black --check --diff .
        echo "::endgroup::"

    - name: Check import sorting with isort
      run: |
        echo "::group::Import Sorting"
        python -m isort --check-only --diff .
        echo "::endgroup::"

    - name: Type checking with mypy
      run: |
        echo "::group::MyPy Type Checking"
        python -m mypy main.py --config-file=pyproject.toml
        echo "::endgroup::"

    - name: Security check with bandit
      run: |
        echo "::group::Security Analysis"
        python -m bandit -r . -x tests/ -ll -f json -o bandit-report.json || true
        python -m bandit -r . -x tests/ -ll
        echo "::endgroup::"

    - name: Run unit tests
      run: |
        echo "::group::Unit Tests"
        python -m pytest tests/ -v -m unit --tb=short --junitxml=junit-unit.xml
        echo "::endgroup::"

    - name: Run integration tests
      run: |
        echo "::group::Integration Tests"
        python -m pytest tests/ -v -m integration --tb=short --junitxml=junit-integration.xml
        echo "::endgroup::"

    - name: Run API tests (without external dependencies)
      run: |
        echo "::group::API Tests"
        python -m pytest tests/ -v -m "api and not slow" --tb=short --junitxml=junit-api.xml
        echo "::endgroup::"

    - name: Generate coverage report
      run: |
        echo "::group::Coverage Report"
        python -m pytest tests/ --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
        echo "::endgroup::"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.9'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          junit-*.xml
          htmlcov/
          bandit-report.json

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && matrix.python-version == '3.9'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}

  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit

    - name: Run safety check
      run: |
        echo "::group::Safety Check"
        safety check --json --output safety-report.json || true
        safety check
        echo "::endgroup::"

    - name: Run pip-audit
      run: |
        echo "::group::Pip Audit"
        pip-audit --format=json --output=pip-audit-report.json || true
        pip-audit
        echo "::endgroup::"

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          pip-audit-report.json

  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: quality-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run performance benchmarks
      run: |
        echo "::group::Performance Benchmarks"
        python -m pytest tests/ -v -m slow --tb=short --benchmark-only --benchmark-json=benchmark.json || true
        echo "::endgroup::"

    - name: Performance profiling
      run: |
        echo "::group::Performance Profiling"
        python -m cProfile -o profile_stats.prof main.py || true
        echo "::endgroup::"

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: |
          benchmark.json
          profile_stats.prof

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Generate documentation
      run: |
        echo "::group::Documentation Generation"
        mkdir -p docs
        python -m pydoc -w main
        mv *.html docs/
        echo "::endgroup::"

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/

  notify-status:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [quality-check, dependency-security]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.quality-check.result == 'success' && needs.dependency-security.result == 'success'
      run: |
        echo "✅ All quality checks passed!"
        echo "Theater Critics System is ready for deployment."

    - name: Notify failure
      if: needs.quality-check.result == 'failure' || needs.dependency-security.result == 'failure'
      run: |
        echo "❌ Quality checks failed!"
        echo "Please review the failed checks before merging."
        exit 1

    - name: Summary report
      if: always()
      run: |
        echo "## Theater Critics System - Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.quality-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.dependency-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Review any failed checks" >> $GITHUB_STEP_SUMMARY
        echo "- Check uploaded artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY
        echo "- Ensure all tests pass before merging" >> $GITHUB_STEP_SUMMARY