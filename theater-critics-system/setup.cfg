[flake8]
# Theater Critics System - Code Quality Configuration
max-line-length = 88
extend-ignore = 
    # E203: whitespace before ':' (conflicts with black)
    E203,
    # W503: line break before binary operator (conflicts with black)
    W503,
    # E501: line too long (handled by black)
    E501
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    .pytest_cache,
    node_modules,
    *.egg-info,
    build,
    dist

# Theater-specific settings
per-file-ignores =
    # Tests can have long lines and unused imports
    test_*.py:E501,F401
    # Analysis files may have complex expressions
    *_analysis.py:C901
    # Dashboard files may have long strings
    comprehensive_dashboard.html:E501

# Complexity settings
max-complexity = 12
max-cognitive-complexity = 15

# Docstring settings
docstring-convention = google
require-plugins = 
    flake8-docstrings,
    flake8-import-order,
    flake8-bugbear

[coverage:run]
source = .
omit = 
    */venv/*,
    */test_*,
    setup.py,
    */__pycache__/*
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
show_missing = True
precision = 2
fail_under = 80

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
    unit: marks unit tests
    api: marks API integration tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning